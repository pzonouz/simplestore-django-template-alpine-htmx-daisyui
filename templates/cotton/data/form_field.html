<div class="form-control">
    {% if field.id_for_label and not edit %}
        <label class="label"
               for="{{ field.id_for_label }}">
            <span class="label-text font-semibold">{{ label|default:field.label }}</span>
        </label>
    {% endif %}
    {{ field }}
    {% if field.errors %}
        {% for error in field.errors %}
            <span class="text-error text-xs mt-1">{{ error }}</span>
        {% endfor %}
    {% endif %}
</div>
