<div x-data="{ menuOpen: false }">
    <template x-if="window.innerWidth < 1024">
        <span x-show="!menuOpen"
              @click="menuOpen = !menuOpen"
              class="icon-[heroicons--bars-3-20-solid] w-10 h-10 m-2 cursor-pointer"></span>
    </template>
    <div x-data="{ menu: window.innerWidth < 1024 ? JSON.parse(document.getElementById('menu-data').textContent) : [] }">
        <!-- Recursive Node Template -->
        <template id="mobile-menu-node">
            <li class="w-full"
                x-data="{
                    open: false,
                    hasChildren: Boolean(item && item.children && item.children.length > 0)
                }">
                <!-- Item with Submenu (Parent Header) -->
                <template x-if="hasChildren">
                    <div @click.stop="open = !open"
                         class="flex items-center justify-between gap-2 px-4 py-2 transition-colors whitespace-nowrap cursor-pointer rounded-md hover:bg-gray-100">
                        <span x-text="item.title"></span>
                        <span class="icon-[heroicons--chevron-down-20-solid] text-lg transition-transform duration-200"
                              :class="{ 'rotate-180': open }"></span>
                    </div>
                </template>
                <!-- Item without Submenu (Link) -->
                <template x-if="!hasChildren">
                    <a :href="item.url || '#'"
                       class="flex items-center justify-between gap-2 px-4 py-2 transition-colors whitespace-nowrap cursor-pointer rounded-md hover:bg-gray-100">
                        <span x-text="item.title"></span>
                    </a>
                </template>
                <!-- Submenu: In-Flow Accordion (Pushes elements down) -->
                <template x-if="hasChildren">
                    <ul x-show="open"
                        x-transition:enter="transition ease-out duration-150"
                        x-transition:enter-start="opacity-0 -translate-y-1"
                        x-transition:enter-end="opacity-100 translate-y-0"
                        x-transition:leave="transition ease-in duration-100"
                        x-transition:leave-start="opacity-100 translate-y-0"
                        x-transition:leave-end="opacity-0 -translate-y-1"
                        class="flex flex-col w-full pr-4 border-r-2 border-gray-200 my-1 space-y-1">
                        <template x-for="child in item.children"
                                  :key="child.title">
                            <li x-data="{ item: child, isRoot: false }"
                                x-init="$nextTick(() => Alpine.initTree($el))"
                                x-html="document.getElementById('mobile-menu-node').innerHTML">
                            </li>
                        </template>
                    </ul>
                </template>
            </li>
        </template>
        <!-- BackDrop -->
        <div x-show="menuOpen"
             @click="menuOpen=false"
             {% comment %}
             x-transition:enter="transition-opacity ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition-opacity ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             {% endcomment %}
             @click="menuOpen = false"
             class="fixed inset-0 bg-black/20 backdrop-blur-sm z-40 lg:hidden"
             class="fixed h-screen w-screen bg-gray-100/50"></div>
        <!-- Top-Level Root Menu Bar -->
        <div x-show="menuOpen"
             class="h-16"></div>
        <ul x-show="menuOpen"
            style="font-family: yekan"
            class="fixed top-0 flex lg:hidden flex-col justify-start items-start p-4 bg-white text-sky-950 rounded-sm w-56 z-50 max-h-screen overflow-y-auto">
            <li class="px-4 py-4 font-bold">فروشگاه</li>
            <template x-for="item in menu"
                      :key="item.title">
                <li x-data="{ item: item, isRoot: true }"
                    x-init="$nextTick(() => Alpine.initTree($el))"
                    class="w-full"
                    x-html="document.getElementById('mobile-menu-node').innerHTML">
                </li>
            </template>
        </ul>
    </div>
</div>
